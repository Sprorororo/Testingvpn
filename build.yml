name: Build SavaVPN APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'patch/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install apktool
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool aapt zipalign

      - name: Set up Python for icon generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: pip install --break-system-packages Pillow

      - name: Download base APK (SFA, F-Droid official signed build)
        run: |
          curl -L -o base.apk "https://f-droid.org/repo/io.nekohasekai.sfa_728.apk"
          ls -la base.apk

      - name: Decode APK with apktool
        run: |
          apktool d base.apk -o decoded -f

      - name: Apply branding patches
        run: |
          bash patch/apply_patches.sh decoded

      - name: Rebuild APK
        run: |
          apktool b decoded -o SavaVPN-unsigned.apk

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore sava-release.keystore \
            -alias savavpn \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass savavpnbeta -keypass savavpnbeta \
            -dname "CN=SavaVPN, OU=SavaVPN, O=SavaVPN, L=Izhevsk, S=Udmurtia, C=RU"

      - name: Zipalign
        run: |
          zipalign -f -p 4 SavaVPN-unsigned.apk SavaVPN-aligned.apk

      - name: Sign APK
        run: |
          jarsigner -verbose \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore sava-release.keystore \
            -storepass savavpnbeta \
            -signedjar SavaVPN-beta.apk \
            SavaVPN-aligned.apk savavpn

      - name: Verify signature
        run: |
          jarsigner -verify -verbose SavaVPN-beta.apk || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SavaVPN-beta
          path: SavaVPN-beta.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-${{ github.run_number }}
          name: SavaVPN beta build ${{ github.run_number }}
          files: SavaVPN-beta.apk
          body: |
            Автоматическая сборка SavaVPN (beta).

            Приложение построено на открытом ядре sing-box (проекты семейства
            sing-box-for-android / NekoBox для Android, лицензия GPL-3.0).
            Исходный код доступен в этом репозитории.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
